name = "ancient-grass-94b8"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# Serve the static single-page app straight from the Worker (free).
# Any request that is not a real file falls through to the Worker's fetch()
# handler, which handles /api/* and forwards everything else back to the SPA.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# One Durable Object instance per meeting room. Handles WebSocket signaling
# for WebRTC, live whiteboard broadcast, and whiteboard persistence.
# Durable Objects with the SQLite backend are available on the FREE plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

# Single global instance storing user accounts (email + hashed password).
[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthDurableObject"]

# ---------------------------------------------------------------------------
# Optional configuration. Set these in the Cloudflare dashboard (Settings ->
# Variables) or with `wrangler secret put` so they are not committed to git.
#
# AUTH_SECRET          : secret used to sign login sessions (JWT). Set a long
#                        random value with `wrangler secret put AUTH_SECRET`.
# RECORDING_UPLOAD_URL : your own server endpoint that accepts a POST
#                        multipart upload of the recorded .webm file.
# TURN_URLS            : comma-separated TURN server URLs (optional, improves
#                        connectivity behind strict NATs). STUN is free below.
# TURN_USERNAME        : TURN credential username (optional).
# TURN_CREDENTIAL      : TURN credential password (optional).
# ---------------------------------------------------------------------------
[vars]
RECORDING_UPLOAD_URL = ""
TURN_URLS = ""
TURN_USERNAME = ""
TURN_CREDENTIAL = ""
